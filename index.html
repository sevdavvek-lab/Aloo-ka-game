<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10281f">
<title>Penalty Shootout</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#07140f;color:#fff}
body{display:flex;align-items:center;justify-content:center}
.game{width:100%;height:100%;max-width:900px;position:relative;overflow:hidden;background:linear-gradient(#172c48 0 39%,#315b35 39% 100%)}
.sky{position:absolute;inset:0 0 auto;height:42%;background:linear-gradient(#173451,#52728b)}
.stands{position:absolute;left:0;right:0;top:24%;height:22%;background:
radial-gradient(circle at 5% 45%,#f6d365 0 2px,transparent 3px),
radial-gradient(circle at 12% 60%,#e76f51 0 2px,transparent 3px),
radial-gradient(circle at 21% 40%,#fff 0 2px,transparent 3px),
radial-gradient(circle at 31% 65%,#9ad1d4 0 2px,transparent 3px),
radial-gradient(circle at 42% 45%,#f6d365 0 2px,transparent 3px),
radial-gradient(circle at 54% 60%,#e76f51 0 2px,transparent 3px),
radial-gradient(circle at 66% 42%,#fff 0 2px,transparent 3px),
radial-gradient(circle at 78% 62%,#9ad1d4 0 2px,transparent 3px),
radial-gradient(circle at 90% 45%,#f6d365 0 2px,transparent 3px);
background-color:#263b50;border-top:8px solid #172b3e;border-bottom:8px solid #172b3e}
.standline{position:absolute;left:0;right:0;top:42%;height:5px;background:#d8d8d8;opacity:.55}
.pitch{position:absolute;left:0;right:0;bottom:0;height:57%;background:linear-gradient(#397343,#24552e)}
.pitch:before{content:"";position:absolute;left:7%;right:7%;top:28%;height:2px;background:rgba(255,255,255,.35)}
.goal{position:absolute;left:11%;right:11%;top:12%;height:46%;border:5px solid #fff;border-bottom-width:7px;box-shadow:0 10px 25px rgba(0,0,0,.3)}
.net{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(255,255,255,.15) 25px 26px),repeating-linear-gradient(0deg,transparent 0 20px,rgba(255,255,255,.12) 21px 22px);transform:perspective(180px) rotateX(10deg);transform-origin:bottom}
.zone{position:absolute;top:0;bottom:0;width:33.333%;border-left:1px dashed rgba(255,255,255,.22);z-index:2}
.zone:nth-child(2){left:33.333%}.zone:nth-child(3){left:66.666%}.zone:first-child{left:0}
.keeper{position:absolute;z-index:5;left:50%;bottom:17%;width:58px;height:105px;transform:translateX(-50%);transition:left .42s ease,transform .42s ease}
.body{position:absolute;left:16px;top:25px;width:28px;height:55px;background:#e84d4d;border-radius:13px 13px 8px 8px}
.head{position:absolute;left:20px;top:3px;width:20px;height:20px;border-radius:50%;background:#d89a73}
.arm{position:absolute;top:28px;width:12px;height:48px;background:#e84d4d;border-radius:8px;transform-origin:top}
.arm.l{left:7px;transform:rotate(25deg)}.arm.r{right:7px;transform:rotate(-25deg)}
.leg{position:absolute;top:74px;width:13px;height:34px;background:#17283a;border-radius:7px}
.leg.l{left:18px;transform:rotate(6deg)}.leg.r{right:18px;transform:rotate(-6deg)}
.keeper.dive-left{transform:translateX(-50%) rotate(-35deg)}.keeper.dive-right{transform:translateX(-50%) rotate(35deg)}
.ball{position:absolute;z-index:8;left:50%;bottom:8%;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:inset -5px -5px 0 #ddd;transform:translate(-50%,50%);transition:left .75s cubic-bezier(.2,.7,.2,1),bottom .75s cubic-bezier(.2,.7,.2,1),transform .75s ease}
.ball.kick{transform:translate(-50%,50%) rotate(420deg) scale(.75)}
.shooter{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);font-size:46px;filter:drop-shadow(0 5px 3px rgba(0,0,0,.3))}
.hud{position:absolute;z-index:20;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}
.title{font-size:18px;font-weight:900;text-shadow:0 2px 4px #000}.score{background:rgba(0,0,0,.45);padding:9px 13px;border-radius:12px;font-weight:800}
.panel{position:absolute;z-index:20;bottom:16px;left:12px;right:12px;background:rgba(4,13,9,.78);backdrop-filter:blur(8px);border-radius:18px;padding:14px;text-align:center}
.prompt{font-weight:800;font-size:15px;margin-bottom:10px}
.buttons{display:flex;gap:8px}.side{flex:1;border:0;border-radius:12px;padding:14px 5px;background:#fff;color:#15251d;font-weight:900;font-size:14px}
.side:active{transform:scale(.97)}
.result{display:none;position:absolute;z-index:30;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center}
.resultbox{background:#fff;color:#17251d;border-radius:22px;padding:30px 25px;text-align:center;width:min(88%,360px);box-shadow:0 15px 50px #0008}
.resulttext{font-size:38px;font-weight:1000;margin-bottom:8px}.resultsub{color:#68736c;margin-bottom:20px}
.playagain{border:0;background:#1f7a4d;color:#fff;padding:13px 22px;border-radius:12px;font-weight:900}
@media(min-width:700px){.game{height:92vh;border-radius:20px;box-shadow:0 20px 70px #000}}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="sky"></div><div class="stands"></div><div class="standline"></div><div class="pitch"></div>
  <div class="goal" id="goal">
    <div class="net"></div>
    <div class="zone" data-side="left"></div>
    <div class="zone" data-side="center"></div>
    <div class="zone" data-side="right"></div>
  </div>
  <div class="keeper" id="keeper">
    <div class="head"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div>
    <div class="leg l"></div><div class="leg r"></div>
  </div>
  <div class="ball" id="ball"></div>
  <div class="shooter">⚽</div>

  <div class="hud"><div class="title">⚽ PENALTY SHOOTOUT</div><div class="score">Goals: <span id="score">0</span></div></div>

  <div class="panel">
    <div class="prompt" id="prompt">Choose where to shoot</div>
    <div class="buttons">
      <button class="side" data-side="left">LEFT</button>
      <button class="side" data-side="center">CENTER</button>
      <button class="side" data-side="right">RIGHT</button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="resultbox">
      <div class="resulttext" id="resultText">GOAL! ⚽</div>
      <div class="resultsub" id="resultSub">The keeper guessed wrong.</div>
      <button class="playagain" onclick="resetGame()">TAKE ANOTHER PENALTY</button>
    </div>
  </div>
</div>

<script>
let score=0, locked=false;
const keeper=document.getElementById('keeper');
const ball=document.getElementById('ball');
const prompt=document.getElementById('prompt');
const result=document.getElementById('result');

function keeperPosition(side){
  if(side==='left') return '22%';
  if(side==='right') return '78%';
  return '50%';
}
function kickPosition(side){
  if(side==='left') return '28%';
  if(side==='right') return '72%';
  return '50%';
}
function shoot(side){
  if(locked) return;
  locked=true;
  prompt.textContent='The keeper is diving...';

  const options=['left','center','right'];
  const keeperSide=options[Math.floor(Math.random()*3)];

  keeper.style.left=keeperPosition(keeperSide);
  keeper.className='keeper ' + (keeperSide==='left'?'dive-left':keeperSide==='right'?'dive-right':'');

  requestAnimationFrame(()=>{
    ball.classList.add('kick');
    ball.style.left=kickPosition(side);
    ball.style.bottom='58%';
  });

  setTimeout(()=>{
    const win=side!==keeperSide;
    if(win){score++;document.getElementById('score').textContent=score;}
    document.getElementById('resultText').textContent=win?'GOAL! ⚽🔥':'SAVED! 🧤';
    document.getElementById('resultSub').textContent=win
      ? 'You shot '+side+' and the keeper went '+keeperSide+'.'
      : 'You shot '+side+' and the keeper guessed '+keeperSide+'.';
    result.style.display='flex';
  },900);
}
document.querySelectorAll('.side').forEach(btn=>btn.addEventListener('click',()=>shoot(btn.dataset.side)));

function resetGame(){
  result.style.display='none';locked=false;
  keeper.className='keeper';keeper.style.left='50%';
  ball.className='ball';ball.style.left='50%';ball.style.bottom='8%';
  prompt.textContent='Choose where to shoot';
}
</script>
</body>
</html>
