<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Penalty Shootout</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#123b2a;color:#fff}
body{touch-action:manipulation}
.game{height:100dvh;min-height:620px;position:relative;overflow:hidden;background:
linear-gradient(#183e5d 0 33%,#284b62 33% 47%,#1d5b32 47% 100%)}
.stadium{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stadium:before{
 content:"";position:absolute;left:-10%;right:-10%;top:36%;height:23%;
 background:
 radial-gradient(circle at 7% 35%,#f5d35a 0 3px,transparent 4px),
 radial-gradient(circle at 18% 60%,#d8e8ef 0 3px,transparent 4px),
 radial-gradient(circle at 30% 42%,#f58b75 0 3px,transparent 4px),
 radial-gradient(circle at 43% 55%,#ffe15b 0 3px,transparent 4px),
 radial-gradient(circle at 56% 35%,#f37e68 0 3px,transparent 4px),
 radial-gradient(circle at 68% 58%,#d9f0f0 0 3px,transparent 4px),
 radial-gradient(circle at 80% 40%,#f6d04e 0 3px,transparent 4px),
 radial-gradient(circle at 93% 60%,#b9dfe8 0 3px,transparent 4px);
 background-size:130px 72px;
 opacity:.9;
 transition:transform .55s ease;
}
.stadium.lively:before{transform:translateX(22px) translateY(-4px) scale(1.025)}
.field-lines{position:absolute;left:0;right:0;top:47%;height:2px;background:rgba(255,255,255,.45)}
.header{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.logo{font-weight:900;font-size:26px;text-shadow:0 2px 3px #0008}
.score{background:#09283b;border-radius:18px;padding:13px 20px;font-size:22px;font-weight:800;box-shadow:0 7px 18px #0004}
.goal{
 position:absolute;left:11%;right:11%;top:18%;height:40%;
 border:8px solid #fff;background:rgba(18,36,51,.13);z-index:5;
 box-shadow:0 7px 0 #fff3,0 10px 18px #0005;
 overflow:visible;
}
.goal:before{
 content:"";position:absolute;inset:0;
 background:
 repeating-linear-gradient(90deg,transparent 0 58px,rgba(255,255,255,.14) 59px 60px),
 repeating-linear-gradient(0deg,transparent 0 30px,rgba(255,255,255,.13) 31px 32px);
 transform:perspective(280px) rotateX(10deg);transform-origin:bottom;
}
.goal-zone{position:absolute;top:0;bottom:0;width:33.333%;z-index:12}
.zone1{left:0}.zone2{left:33.333%}.zone3{right:0}
.zone1,.zone2,.zone3{cursor:pointer}
.goal-zone:active{background:rgba(255,255,255,.08)}
.keeper{
 position:absolute;left:50%;bottom:8%;width:72px;height:118px;
 transform:translateX(-50%);z-index:10;transition:left .48s cubic-bezier(.2,.8,.25,1),transform .48s cubic-bezier(.2,.8,.25,1);
}
.keeper .head{position:absolute;top:0;left:24px;width:24px;height:24px;border-radius:50%;background:#c98662}
.keeper .body{position:absolute;top:24px;left:10px;width:52px;height:55px;border-radius:16px 16px 8px 8px;background:#e7a62d}
.keeper .arm{position:absolute;top:27px;width:15px;height:60px;border-radius:12px;background:#e7a62d;transform-origin:top}
.keeper .arm.l{left:1px;transform:rotate(18deg)} .keeper .arm.r{right:1px;transform:rotate(-18deg)}
.keeper .leg{position:absolute;top:76px;width:18px;height:42px;border-radius:10px;background:#152d48}
.keeper .leg.l{left:17px;transform:rotate(5deg)} .keeper .leg.r{right:17px;transform:rotate(-5deg)}
.keeper.dive-left{left:18%;transform:translateX(-50%) rotate(-14deg) scale(1.08)}
.keeper.dive-center{left:50%;transform:translateX(-50%) translateY(-4px) scale(1.08)}
.keeper.dive-right{left:82%;transform:translateX(-50%) rotate(14deg) scale(1.08)}
.player{position:absolute;left:50%;bottom:12%;width:94px;height:155px;transform:translateX(-50%);z-index:8}
.player .head{position:absolute;top:0;left:34px;width:32px;height:32px;border-radius:50%;background:#c98662}
.player .shirt{position:absolute;top:29px;left:21px;width:52px;height:72px;border-radius:17px 17px 9px 9px;background:#e83f50}
.player .arm{position:absolute;top:33px;width:18px;height:68px;border-radius:14px;background:#e83f50;transform-origin:top}
.player .arm.l{left:10px;transform:rotate(23deg)} .player .arm.r{right:10px;transform:rotate(-23deg)}
.player .shorts{position:absolute;top:91px;left:25px;width:44px;height:35px;border-radius:7px;background:#132d49}
.player .leg{position:absolute;top:119px;width:17px;height:34px;border-radius:10px;background:#132d49}
.player .leg.l{left:30px}.player .leg.r{right:30px}
.ball{
 position:absolute;left:50%;bottom:9.5%;width:28px;height:28px;z-index:14;
 transform:translate(-50%,50%);transition:transform .65s cubic-bezier(.18,.78,.28,1),left .65s cubic-bezier(.18,.78,.28,1),top .65s cubic-bezier(.18,.78,.28,1);
 filter:drop-shadow(0 4px 3px #0006);
}
.ball:before{content:"⚽";font-size:29px;position:absolute;left:-1px;top:-3px}
.ball.shoot-left{left:25%;top:31%;transform:translate(-50%,-50%) scale(.72)}
.ball.shoot-center{left:50%;top:31%;transform:translate(-50%,-50%) scale(.72)}
.ball.shoot-right{left:75%;top:31%;transform:translate(-50%,-50%) scale(.72)}
.player.kick{animation:kick .42s ease}
@keyframes kick{50%{transform:translateX(-50%) translateY(-8px) rotate(-2deg)}}
.controls{
 position:absolute;left:20px;right:20px;bottom:25px;background:#062214eF;border-radius:25px;
 padding:17px;text-align:center;z-index:25;box-shadow:0 8px 25px #0006
}
.controls h2{margin:0 0 9px;font-size:20px}
.controls p{margin:0;color:#d6eadc;font-size:14px}
.result{
 position:absolute;inset:0;background:#00120acc;display:none;align-items:center;justify-content:center;z-index:50;
 text-align:center;padding:25px
}
.result.show{display:flex}
.panel{background:#0b2a1a;border:2px solid #ffffff30;border-radius:25px;padding:30px 24px;max-width:350px;width:100%;box-shadow:0 18px 50px #0008}
.panel h1{font-size:42px;margin:0 0 12px}
.panel p{font-size:18px;margin:0 0 22px;color:#d8e9df}
.again{border:0;border-radius:15px;padding:15px 26px;background:#fff;color:#10251a;font-size:18px;font-weight:900}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;left:50%;top:48%;z-index:60;animation:spark 900ms ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:55}
.flash.on{animation:flash .32s ease}
@keyframes flash{40%{opacity:.65}}
@media(max-height:700px){
 .goal{top:16%;height:38%}.player{bottom:9%}.ball{bottom:7.5%}.controls{bottom:10px}
}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="stadium" id="stadium"></div>
  <div class="field-lines"></div>

  <header class="header">
    <div class="logo">⚽ PENALTY SHOOTOUT</div>
    <div class="score">Goals: <span id="score">0</span></div>
  </header>

  <div class="goal" id="goal">
    <div class="goal-zone zone1" data-side="left"></div>
    <div class="goal-zone zone2" data-side="center"></div>
    <div class="goal-zone zone3" data-side="right"></div>

    <div class="keeper" id="keeper">
      <div class="head"></div><div class="body"></div>
      <div class="arm l"></div><div class="arm r"></div>
      <div class="leg l"></div><div class="leg r"></div>
    </div>
  </div>

  <div class="player" id="player">
    <div class="head"></div><div class="shirt"></div>
    <div class="arm l"></div><div class="arm r"></div>
    <div class="shorts"></div><div class="leg l"></div><div class="leg r"></div>
  </div>

  <div class="ball" id="ball"></div>

  <div class="controls">
    <h2>Choose where to shoot</h2>
    <p>Tap the LEFT, CENTER or RIGHT side of the goal</p>
  </div>

  <div class="flash" id="flash"></div>

  <div class="result" id="result">
    <div class="panel">
      <h1 id="resultTitle">GOAL! ⚽</h1>
      <p id="resultText">You beat the goalkeeper!</p>
      <button class="again" id="again">SHOOT AGAIN</button>
    </div>
  </div>
</div>

<script>
const goal = document.getElementById("goal");
const keeper = document.getElementById("keeper");
const ball = document.getElementById("ball");
const player = document.getElementById("player");
const result = document.getElementById("result");
const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");
const scoreEl = document.getElementById("score");
const stadium = document.getElementById("stadium");
const flash = document.getElementById("flash");
const again = document.getElementById("again");

let score = 0;
let locked = false;

function keeperSideClass(side){
  return "dive-" + side;
}

function shoot(side){
  if(locked) return;
  locked = true;

  const sides = ["left","center","right"];
  const keeperSide = sides[Math.floor(Math.random()*3)];

  player.classList.add("kick");
  keeper.className = "keeper " + keeperSideClass(keeperSide);

  // Make the crowd shift slightly after every shot.
  stadium.classList.remove("lively");
  void stadium.offsetWidth;
  stadium.classList.add("lively");

  ball.className = "ball shoot-" + side;

  setTimeout(() => {
    if(side !== keeperSide){
      score++;
      scoreEl.textContent = score;
      resultTitle.textContent = "GOAL! ⚽";
      resultText.textContent = "The keeper went " + keeperSide + ". You shot " + side + "!";
      makeSparkles();
      flash.classList.add("on");
      setTimeout(()=>flash.classList.remove("on"),350);
    }else{
      resultTitle.textContent = "SAVED! 🧤";
      resultText.textContent = "The keeper guessed " + side + "!";
    }
    result.classList.add("show");
  }, 700);
}

document.querySelectorAll(".goal-zone").forEach(zone=>{
  zone.addEventListener("click",()=>shoot(zone.dataset.side));
  zone.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    shoot(zone.dataset.side);
  },{passive:false});
});

function makeSparkles(){
  for(let i=0;i<42;i++){
    const s=document.createElement("div");
    s.className="spark";
    const angle=Math.random()*Math.PI*2;
    const dist=100+Math.random()*260;
    s.style.setProperty("--x",Math.cos(angle)*dist+"px");
    s.style.setProperty("--y",Math.sin(angle)*dist+"px");
    s.style.left=(35+Math.random()*30)+"%";
    s.style.top=(35+Math.random()*30)+"%";
    s.style.width=(4+Math.random()*7)+"px";
    s.style.height=s.style.width;
    document.getElementById("game").appendChild(s);
    setTimeout(()=>s.remove(),950);
  }
}

function reset(){
  locked=false;
  result.classList.remove("show");
  keeper.className="keeper";
  player.classList.remove("kick");
  ball.className="ball";
  stadium.classList.remove("lively");
}

again.addEventListener("click",reset);
</script>
</body>
</html>
